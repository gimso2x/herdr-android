name: Terminal diagnostics

# Metrics-only comparison of the live herdr-web-ui terminal area in headless Chrome and in the app's
# Android WebView (debug build). The repository is public: nothing is uploaded; the job logs carry
# counts, booleans, rectangles and short error messages only. Both jobs run the page with the
# narrowed diagnostic guard (interact role kept, attach/resize sent; input/keys/submit/pending-action/
# secret/take-over frames and every non-GET request dropped): app/src/debug/assets/diag_probe.js.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap the Access cookie from the service token
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" && test -n "$BASE_URL" || { echo 'CI token/base-url secrets are missing' >&2; exit 1; }
          umask 077
          headers=$(curl -sS -D - -o /dev/null -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" $BASE_URL/api/health)
          cookie=$(printf '%s' "$headers" | tr -d '\r' | sed -n -E 's/^[Ss]et-[Cc]ookie: CF_Authorization=([^;]+).*/\1/p' | sed -n 1p)
          test -n "$cookie" || { echo 'no CF_Authorization cookie in the response' >&2; exit 1; }
          echo "::add-mask::$cookie"
          printf '%s' "$cookie" > "$RUNNER_TEMP/cf-cookie"
          echo "cookie bootstrapped, length ${#cookie}"
      - name: Install puppeteer-core
        run: npm install --no-save --no-package-lock --prefix ci/diag puppeteer-core@23
      - name: Chrome metrics
        env:
          CF_COOKIE_FILE: ${{ runner.temp }}/cf-cookie
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          google-chrome --version
          node ci/diag/chrome-metrics.mjs
      - name: Remove the cookie file
        if: always()
        run: rm -f "$RUNNER_TEMP/cf-cookie"

  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build the debug and test APKs before the emulator starts
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          pkill -f KotlinCompileDaemon || true
          ./gradlew --stop
      - name: Free disk space for the emulator userdata partition
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write QA token file
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" && test -n "$BASE_URL" || { echo 'CI token/base-url secrets are missing' >&2; exit 1; }
          umask 077
          jq -n '{id: env.CF_ID, secret: env.CF_SECRET, baseUrl: env.BASE_URL, liveQa: true}' > "$RUNNER_TEMP/qa-token.json"
      - name: WebView metrics on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -no-boot-anim -no-metrics
          disk-size: 4096M
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: ./ci/terminal-diag.sh
      - name: Remove QA token file
        if: always()
        run: rm -f "$RUNNER_TEMP/qa-token.json"
