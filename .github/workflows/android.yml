name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      apis:
        description: 'Debug only: JSON list of emulator API levels (empty = [34, 35])'
        required: false
        default: ''
      phases:
        description: 'Debug only: space separated instrumented group ids (empty = all phases of the API)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # v3's default also installs the obsolete `tools` package, which
          # current runner cmdline-tools no longer provide.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode signing keystore when secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herdr.jks"
            {
              echo "storeFile=$RUNNER_TEMP/herdr.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$RUNNER_TEMP/signing.properties"
            echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
          fi
      - name: Assemble, unit test and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error

  instrumented:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.apis || '[34, 35]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Free disk space for the emulator userdata partition
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /home/runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install PulseAudio for the emulator audio backend
        # The emulator is started with audio on (microphone scenarios); without a running
        # PulseAudio server its backend fails to initialise and the guest cannot open the microphone.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
      - name: Write QA token file
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" || { echo 'CI token secrets are missing' >&2; exit 1; }
          umask 077
          jq -n '{id: env.CF_ID, secret: env.CF_SECRET, liveQa: true}' > "$RUNNER_TEMP/qa-token.json"
      - name: Instrumented QA on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_PHASES: ${{ inputs.phases }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # No -noaudio: the microphone scenarios need the emulator's audio.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-metrics
          disk-size: 4096M
          pre-emulator-launch-script: pulseaudio --start --exit-idle-time=-1
          disable-animations: true
          script: ./ci/instrumented.sh ${{ matrix.api-level }}
      - name: Remove QA token file
        if: always()
        run: rm -f "$RUNNER_TEMP/qa-token.json"
      - name: Secret scan
        if: always()
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" || { echo 'scan secrets are missing' >&2; exit 1; }
          files=$( { grep -r -l -F -e "$CF_SECRET" -e "$CF_ID" app/build/reports app/build/outputs qa-screens 2>/dev/null || true; } | wc -l)
          apk=0
          for a in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ -f "$a" ]; then
              n=$(unzip -p "$a" | grep -c -F -e "$CF_SECRET" -e "$CF_ID" || true)
              apk=$((apk + n))
            fi
          done
          total=$((files + apk))
          echo "secret-scan files=$files apk=$apk"
          echo "$total"
          test "$total" -eq 0
      - name: Upload instrumented QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-qa-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            qa-screens/
          retention-days: 7
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'signing secrets missing' >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herdr.jks"
          {
            echo "storeFile=$RUNNER_TEMP/herdr.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $flags
