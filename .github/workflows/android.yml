name: Android

# Tiers: fast (push, pull_request) = plan + build only (assemble, unit tests, lint; no emulator, no secrets).
# full (tags v*, weekly schedule, workflow_dispatch tier=full) = plus both emulator legs; release needs them.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'full = everything incl. live L1-L4 and API 35; fast = fixture phases on API 34 only'
        type: choice
        options: [full, fast]
        default: full
      apis:
        description: 'Debug only: JSON list of emulator API levels (empty = tier default)'
        required: false
        default: ''
      phases:
        description: 'Debug only: space separated instrumented group ids (empty = all phases of the tier/API)'
        required: false
        default: ''
      gpus:
        description: 'Debug only: JSON list of emulator -gpu modes (empty = swiftshader_indirect); a list also turns on -verbose and keeps the emulator output for the death facts'
        required: false
        default: ''
      emu-build:
        description: 'Debug only: emulator build number to pin (empty = the runner image build)'
        required: false
        default: ''

concurrency:
  # Fast and full runs of one ref never cancel each other (a push must not kill a manual full run).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'ci' || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides the tier once. fast = push to main/branches and pull requests (fixture phases, API 34 only,
  # no secrets); full = tags v*, schedule, and manual runs with tier=full (everything, incl. live L1-L4).
  # The phase lists themselves live in ci/instrumented.sh (--tier).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tier="${INPUT_TIER:-full}" ;;
            schedule) tier=full ;;
            *) case "$REF" in refs/tags/v*) tier=full ;; *) tier=fast ;; esac ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "tier: $tier"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # v3's default also installs the obsolete `tools` package, which
          # current runner cmdline-tools no longer provide.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode signing keystore when secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herdr.jks"
            {
              echo "storeFile=$RUNNER_TEMP/herdr.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$RUNNER_TEMP/signing.properties"
            echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
          fi
      - name: Assemble, unit test and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error

  instrumented:
    if: needs.plan.outputs.tier == 'full'
    needs: [build, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.apis || '[34, 35]') }}
        gpu: ${{ fromJSON(inputs.gpus || '["swiftshader_indirect"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build-tools (aapt2 for the manifest host-check)
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download the APKs built by the build job
        # No second Gradle build here: the build job already produced the debug and test APKs.
        uses: actions/download-artifact@v4
        with:
          name: herdr-debug-apk
          path: app/build/outputs/apk
      - name: Free disk space for the emulator userdata partition
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /home/runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install PulseAudio for the emulator audio backend
        # The emulator is started with audio on (microphone scenarios); without a running
        # PulseAudio server its backend fails to initialise and the guest cannot open the microphone.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
      - name: Write QA token file
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" && test -n "$BASE_URL" || { echo 'CI token/base-url secrets are missing' >&2; exit 1; }
          umask 077
          jq -n '{id: env.CF_ID, secret: env.CF_SECRET, baseUrl: env.BASE_URL, liveQa: true}' > "$RUNNER_TEMP/qa-token.json"
      - name: Instrumented QA on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_PHASES: ${{ inputs.phases }}
        with:
          api-level: ${{ matrix.api-level }}
          emulator-build: ${{ inputs.emu-build }}
          # AOSP image: no Play services, whose process death on the 2-core runner killed the app.
          target: default
          arch: x86_64
          # No -noaudio: the microphone scenarios need the emulator's audio.
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -no-boot-anim -no-metrics ${{ inputs.gpus && '-verbose >/tmp/emulator.log 2>&1' || '' }}
          disk-size: 4096M
          ram-size: 4096M
          heap-size: 512M
          pre-emulator-launch-script: pulseaudio --start --exit-idle-time=-1
          disable-animations: true
          script: ./ci/instrumented.sh ${{ matrix.api-level }} --tier full
      - name: Remove QA token file
        if: always()
        run: rm -f "$RUNNER_TEMP/qa-token.json"
      - name: Secret scan
        if: always() && needs.plan.outputs.tier == 'full'
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" && test -n "$BASE_URL" || { echo 'scan secrets are missing' >&2; exit 1; }
          BASE_HOST=${BASE_URL#https://}
          BASE_HOST=${BASE_HOST%%/*}
          files=$( { grep -r -l -F -e "$CF_SECRET" -e "$CF_ID" -e "$BASE_HOST" app/build/reports app/build/outputs qa-screens 2>/dev/null || true; } | wc -l)
          apk=0
          for a in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ -f "$a" ]; then
              n=$(unzip -p "$a" | grep -c -F -e "$CF_SECRET" -e "$CF_ID" -e "$BASE_HOST" || true)
              apk=$((apk + n))
            fi
          done
          total=$((files + apk))
          echo "secret-scan files=$files apk=$apk"
          echo "$total"
          test "$total" -eq 0
      - name: Drop live-server evidence (public repository)
        if: always()
        run: rm -f qa-screens/l1.png qa-screens/L[1-4]*-fail.png qa-screens/L[1-4]*Test-*.txt
      - name: Upload instrumented QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-qa-${{ matrix.api-level }}-${{ matrix.gpu }}
          path: |
            app/build/reports/androidTests/
            qa-screens/
          retention-days: 7
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'signing secrets missing' >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herdr.jks"
          {
            echo "storeFile=$RUNNER_TEMP/herdr.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $flags
