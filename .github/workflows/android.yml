name: Android

# Tiers: fast (push, pull_request) = plan + build only (assemble, unit tests, lint, minified release build with a
# throwaway key, CI script self-tests; no emulator, no secrets).
# full (tags v*, weekly schedule, workflow_dispatch tier=full) = plus both emulator legs.
# The release job runs ONLY for a tag push (never for a manual dispatch, whatever its overrides).
#
# Every `uses:` is pinned to a full commit SHA (version in the comment); Dependabot (github-actions) bumps them.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'full = build plus emulator API 34 (all phases incl. live L1-L4) and API 35 subset; fast = build only, no emulator'
        type: choice
        options: [full, fast]
        default: full
      apis:
        description: 'Debug only: JSON list of emulator API levels (empty = tier default)'
        required: false
        default: ''
      phases:
        description: 'Debug only: space separated instrumented group ids (empty = all phases of the tier/API; unknown ids are refused)'
        required: false
        default: ''
      gpus:
        description: 'Debug only: JSON list of emulator -gpu modes (empty = per-API default: swangle_indirect on 34, swiftshader_indirect on 35); a list also turns on -verbose and keeps the emulator output for the death facts'
        required: false
        default: ''
      emu-build:
        description: 'Debug only: emulator build number to pin (digits; empty = the runner image build)'
        required: false
        default: ''
      phone-apk:
        description: 'Also build a separate phone-test APK without emulator notification-access components'
        type: boolean
        default: false

concurrency:
  # Fast and full runs of one ref never cancel each other (a push must not kill a manual full run).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'ci' || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides the tier once and validates every dispatch input BEFORE anything uses it: the matrix, the emulator
  # options and the script line only ever receive the validated values below (ci/qa-lib.sh qa_validate_dispatch).
  # fast = push to main/branches and pull requests; full = tags v*, schedule, and manual runs with tier=full.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
      apis: ${{ steps.pick.outputs.apis }}
      gpus: ${{ steps.pick.outputs.gpus }}
      emu_build: ${{ steps.pick.outputs.emu_build }}
      verbose: ${{ steps.pick.outputs.verbose }}
      phases: ${{ steps.pick.outputs.phases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_APIS: ${{ inputs.apis }}
          INPUT_GPUS: ${{ inputs.gpus }}
          INPUT_EMU_BUILD: ${{ inputs.emu-build }}
          QA_PHASES: ${{ inputs.phases }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tier="${INPUT_TIER:-full}" ;;
            schedule) tier=full ;;
            *) case "$REF" in refs/tags/v*) tier=full ;; *) tier=fast ;; esac ;;
          esac
          case "$tier" in full|fast) ;; *) echo "bad tier" >&2; exit 1 ;; esac
          validated=$(TIER="$tier" ci/instrumented.sh --validate-dispatch) || exit 1
          {
            echo "tier=$tier"
            printf '%s\n' "$validated"
          } >> "$GITHUB_OUTPUT"
          echo "tier: $tier"
          printf '%s\n' "$validated"

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd bridge --frozen-lockfile
      - run: bun test bridge

  build:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3's default also installs the obsolete `tools` package, which
          # current runner cmdline-tools no longer provide.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Firebase client configuration
        env:
          HERDR_GOOGLE_SERVICES_B64: ${{ secrets.HERDR_GOOGLE_SERVICES_B64 }}
        run: node ci/firebase-config.mjs
      - name: CI script self-tests
        run: |
          for f in ci/*.sh scripts/*.sh gradlew; do bash -n "$f"; done
          ci/selftest.sh
          scripts/release-selftest.sh
          node --test ci/firebase-config.test.mjs
      - name: Throwaway signing key for the release build check
        # The build job never sees the production signing secrets: the minified release build is only verified
        # (R8, resources, signing) with a key generated here and discarded with the runner.
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 -storepass throwaway -keypass throwaway \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=ci-throwaway'
          {
            echo "storeFile=$RUNNER_TEMP/throwaway.jks"
            echo "storePassword=throwaway"
            echo "keyAlias=ci"
            echo "keyPassword=throwaway"
          } > "$RUNNER_TEMP/throwaway-signing.properties"
          echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/throwaway-signing.properties" >> "$GITHUB_ENV"
      - name: Assemble, unit test, lint and build the minified release
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug assembleRelease
      - name: Check the release APK (signature, no debug seams)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 1,3p
          if unzip -l "$apk" | grep -q -E 'live_qa_guard|diag_probe|render_counts'; then
            echo 'the release APK contains QA assets' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "^package:|application-debuggable" || true
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo 'the release APK is debuggable' >&2
            exit 1
          fi
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
      - name: Upload debug APKs for the emulator job
        # Full tier only, one day: the debug APK is debuggable and carries the QA seams (it is signed with the
        # throwaway debug key and installs as com.gimso2x.herdr.debug, so it can never replace the real app).
        if: success() && needs.plan.outputs.tier == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - name: Build phone-test APK without notification access
        if: github.event_name == 'workflow_dispatch' && inputs.phone-apk
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PphoneTest=true assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          manifest=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk" --file AndroidManifest.xml)
          if grep -Eq 'BIND_NOTIFICATION_LISTENER_SERVICE|PushNotificationObserver' <<<"$manifest"; then
            echo 'phone APK contains the emulator notification-access service' >&2
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          grep -q "^package: name='com.gimso2x.herdr.debug'" <<<"$badging"
          ci/secret-scan.sh --apk "$apk"
          sha256sum "$apk"
          echo 'PHONE APK PASS: separate debug package, signature verified, no notification-access service, secret scan clean'
      - name: Upload phone-test APK
        if: success() && github.event_name == 'workflow_dispatch' && inputs.phone-apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-phone-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  instrumented:
    if: needs.plan.outputs.tier == 'full'
    needs: [build, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Validated JSON lists from the plan job (integers / allow-listed gpu names only).
        api-level: ${{ fromJSON(needs.plan.outputs.apis) }}
        gpu: ${{ fromJSON(needs.plan.outputs.gpus) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install build-tools (aapt2 for the manifest host-check)
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download the APKs built by the build job
        # No second Gradle build here: the build job already produced the debug and test APKs.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: herdr-debug-apk
          path: app/build/outputs/apk
      - name: Free disk space for the emulator userdata partition
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /home/runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install PulseAudio for the emulator audio backend
        # The emulator is started with audio on (microphone scenarios); without a running
        # PulseAudio server its backend fails to initialise and the guest cannot open the microphone.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio ${{ needs.plan.outputs.verbose == 'true' && 'gdb' || '' }}
      - name: Write QA token file
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          test -n "$CF_ID" && test -n "$CF_SECRET" && test -n "$BASE_URL" || { echo 'CI token/base-url secrets are missing' >&2; exit 1; }
          umask 077
          jq -n '{id: env.CF_ID, secret: env.CF_SECRET, baseUrl: env.BASE_URL, liveQa: true}' > "$RUNNER_TEMP/qa-token.json"
      - name: Instrumented QA on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Dispatch-derived values arrive here only after the plan job validated them.
          QA_PHASES: ${{ needs.plan.outputs.phases }}
          QA_GDB: ${{ needs.plan.outputs.verbose == 'true' && matrix.gpu == 'swiftshader_indirect' && '1' || '' }}
          API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          emulator-build: ${{ needs.plan.outputs.emu_build }}
          # AOSP image: no Play services, whose process death on the 2-core runner killed the app.
          target: default
          arch: x86_64
          # API 34 runs the live phases: swiftshader_indirect makes its emulator host process die with SIGSEGV in the
          # RenderThread ~5 s after the live page starts rendering (guest mode dies too); swangle_indirect (ANGLE on
          # SwiftShader Vulkan) ran the live and fixture phases green. See doc/evidence/herdr-android-app/ci-split.txt.
          # API 35 runs no live phase and stays on swiftshader_indirect.
          # No -noaudio: the microphone scenarios need the emulator's audio.
          emulator-options: -no-window -gpu ${{ matrix.gpu != 'auto' && matrix.gpu || (matrix.api-level == 34 && 'swangle_indirect' || 'swiftshader_indirect') }} -no-snapshot -no-boot-anim -no-metrics ${{ needs.plan.outputs.verbose == 'true' && '-verbose >/tmp/emulator.log 2>&1' || '' }}
          disk-size: 4096M
          ram-size: 4096M
          heap-size: 512M
          pre-emulator-launch-script: pulseaudio --start --exit-idle-time=-1
          disable-animations: true
          script: ./ci/instrumented.sh "$API_LEVEL" --tier full
      - name: Remove QA token file
        if: always()
        run: rm -f "$RUNNER_TEMP/qa-token.json"
      - name: Drop live-server evidence (public repository)
        # By the live class list of ci/qa-lib.sh (L1-L4 and the P1 live render probe): never uploaded.
        if: always()
        run: |
          source ci/qa-lib.sh
          qa_purge_live_dir qa-screens
      - name: Secret scan
        id: scan
        if: always() && needs.plan.outputs.tier == 'full'
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_CI }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_CI }}
          BASE_URL: ${{ secrets.HERDR_BASE_URL }}
        run: |
          ci/secret-scan.sh \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            app/build/reports qa-screens
      - name: Upload instrumented QA artifacts
        # Only after the scan completed clean: a hit, or a scan that could not run, uploads nothing.
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-qa-${{ matrix.api-level }}-${{ matrix.gpu }}
          path: |
            app/build/reports/androidTests/
            qa-screens/
          retention-days: 7
          if-no-files-found: warn

  release:
    # Release qualification is the default full run of a TAG PUSH only. A manual dispatch (which may carry
    # apis/phases/gpus overrides, or a reduced matrix) never publishes, even on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.tier == 'full'
    needs: [plan, build, instrumented, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Firebase client configuration
        env:
          HERDR_GOOGLE_SERVICES_B64: ${{ secrets.HERDR_GOOGLE_SERVICES_B64 }}
        run: node ci/firebase-config.mjs
      # No third-party action runs after this point: the keystore only exists for the commands below.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.HERDR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'signing secrets missing' >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herdr.jks"
          {
            echo "storeFile=$RUNNER_TEMP/herdr.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $flags
