name: Gradle verification metadata

# Maintenance job (manual): regenerates gradle/verification-metadata.xml (sha256 of every resolved dependency and
# plugin artifact) on a clean Linux runner, proves a strict build passes with it, and uploads it as an artifact.
# Download it, review the diff and commit it:
#   gh run download <run-id> -n verification-metadata -D gradle/ && git add gradle/verification-metadata.xml
# Only Firebase client configuration is used; no server account or production signing key. Artifacts hold checksums only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Every task the CI workflows run, so every configuration they resolve is covered.
      GRADLE_TASKS: assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug assembleRelease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Firebase client configuration
        env:
          HERDR_GOOGLE_SERVICES_B64: ${{ secrets.HERDR_GOOGLE_SERVICES_B64 }}
        run: node ci/firebase-config.mjs
      - name: Throwaway signing key (release tasks need signing properties)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 -storepass throwaway -keypass throwaway \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=ci-throwaway'
          {
            echo "storeFile=$RUNNER_TEMP/throwaway.jks"
            echo "storePassword=throwaway"
            echo "keyAlias=ci"
            echo "keyPassword=throwaway"
          } > "$RUNNER_TEMP/throwaway-signing.properties"
          echo "HERDR_SIGNING_PROPERTIES=$RUNNER_TEMP/throwaway-signing.properties" >> "$GITHUB_ENV"
      - name: Write the verification metadata
        run: |
          rm -f gradle/verification-metadata.xml
          # shellcheck disable=SC2086
          # --continue: the metadata of every task that can run is written even if an unrelated unit test fails.
          ./gradlew --no-daemon --continue --refresh-dependencies --write-verification-metadata sha256 $GRADLE_TASKS || echo "gradle exit $? (checking the file)"
          test -s gradle/verification-metadata.xml
      - name: Prove a strict build passes with the generated metadata
        run: |
          # shellcheck disable=SC2086
          # An unrelated failing unit test must not hide the answer: only a verification failure fails this step.
          set +e
          ./gradlew --no-daemon --continue $GRADLE_TASKS 2>&1 | tee "$RUNNER_TEMP/strict.log"
          if grep -q -i 'dependency verification' "$RUNNER_TEMP/strict.log"; then echo 'dependency verification failed' >&2; exit 1; fi
          echo 'no dependency verification failure'
      - name: Upload the metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 3
          if-no-files-found: error
