apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.gms.google-services'

def signingPropertiesPath = System.getenv('HERDR_SIGNING_PROPERTIES')
def releaseSigningPropertiesFile = signingPropertiesPath
    ? file(signingPropertiesPath)
    : file("${System.properties['user.home']}/.config/herdr-android/signing/signing.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace = "com.gimso2x.herdr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gimso2x.herdr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    sourceSets {
        if (providers.gradleProperty('phoneTest').orNull == 'true') {
            debug.manifest.srcFile 'src/phoneTest/AndroidManifest.xml'
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    testOptions {
        animationsDisabled true
    }
    signingConfigs {
        if (releaseSigningPropertiesFile.exists()) {
            release {
                storeFile file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
                enableV1Signing false
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            // A distinct package (com.gimso2x.herdr.debug) and the throwaway Android debug key (AGP's default
            // debug signing config, never the release key): a debug APK, which is debuggable and carries the QA
            // seams, can neither replace nor upgrade the production install, on a phone or from a CI artifact.
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.getByName('debug')
        }
        release {
            signingConfig signingConfigs.findByName('release')
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !releaseSigningPropertiesFile.exists()) {
        throw new GradleException("Release signing properties not found at ${releaseSigningPropertiesFile}")
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycleVersion"
    implementation "androidx.security:security-crypto:$securityCryptoVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation "androidx.work:work-runtime-ktx:2.10.5"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$mockwebserverVersion"
    testImplementation "org.json:json:20240303"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-web:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:$mockwebserverVersion"
    androidTestImplementation "androidx.work:work-testing:2.10.5"
}
